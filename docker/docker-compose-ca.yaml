version: '3.7'

networks:
  fabric-network:
    name: ${NETWORK_NAME}

services:
  ca-org1:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca-org1
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${ORG1_CA_PORT}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "${ORG1_CA_PORT}:${ORG1_CA_PORT}"
      - "17054:17054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/org1.example.com/ca:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric-network

  ca-org2:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca-org2
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${ORG2_CA_PORT}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - "${ORG2_CA_PORT}:${ORG2_CA_PORT}"
      - "18054:18054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/org2.example.com/ca:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric-network

  ca-orderer:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca-orderer
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    ports:
      - "9054:9054"
      - "19054:19054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/ordererOrganizations/example.com/ca:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric-network

  ca-org3:
    image: hyperledger/fabric-ca:${CA_VERSION}
    container_name: ca-org3
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org3
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${ORG3_CA_PORT}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:21054
    ports:
      - "${ORG3_CA_PORT}:${ORG3_CA_PORT}"
      - "21054:21054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/peerOrganizations/org3.example.com/ca:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric-network
