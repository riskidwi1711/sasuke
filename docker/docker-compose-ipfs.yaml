version: '3.7'

volumes:
  ipfs-data:
  ipfs-staging:

networks:
  fabric-network:
    name: ${NETWORK_NAME}

services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    environment:
      - IPFS_PROFILE=server
      - IPFS_PATH=/data/ipfs
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-staging:/export
      - ../ipfs/scripts:/scripts
    ports:
      - "${IPFS_SWARM_PORT}:4001"      # Swarm
      - "4001:4001/udp"                 # Swarm UDP
      - "${IPFS_API_PORT}:5001"         # API
      - "${IPFS_GATEWAY_PORT}:8080"     # Gateway
    networks:
      - fabric-network
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ipfs-cluster:
    image: ipfs/ipfs-cluster:latest
    container_name: ipfs-cluster
    depends_on:
      - ipfs
    environment:
      - CLUSTER_PEERNAME=ipfs-cluster
      - CLUSTER_SECRET=${CLUSTER_SECRET:-replace-with-your-secret}
      - CLUSTER_IPFSHTTP_NODEMULTIADDRESS=/dns4/ipfs/tcp/5001
      - CLUSTER_CRDT_TRUSTEDPEERS=*
      - CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS=/ip4/0.0.0.0/tcp/9094
      - CLUSTER_MONITORPINGINTERVAL=2s
    ports:
      - "9094:9094"   # API
      - "9095:9095"   # Proxy to IPFS API
      - "9096:9096"   # Cluster swarm
    volumes:
      - ../ipfs/cluster:/data/ipfs-cluster
    networks:
      - fabric-network
    restart: unless-stopped
